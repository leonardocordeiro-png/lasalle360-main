name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply DB Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref bacqgdjiarwkgkwiqgpa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to production
        run: |
          set +e
          PUSH_OUTPUT=$(supabase db push 2>&1)
          PUSH_EXIT=$?
          echo "$PUSH_OUTPUT"

          if [ $PUSH_EXIT -ne 0 ]; then
            REPAIR_IDS=$(echo "$PUSH_OUTPUT" | grep "migration repair --status reverted" | sed 's/.*reverted //')

            if [ -n "$REPAIR_IDS" ]; then
              echo "=== Passo 1: Removendo migrations remotas sem arquivo local ==="
              supabase migration repair --status reverted $REPAIR_IDS

              echo "=== Passo 2: Marcando migrations antigas como já aplicadas (baseline) ==="
              # Todas as migrations locais sem prefixo 20260314 já existem no banco
              # com outros IDs de rastreamento — apenas marcamos como aplicadas.
              PRE_EXISTING=$(ls supabase/migrations/*.sql \
                | sed 's|.*/||' | grep -oP '^\d+' | grep -v '^20260314' | sort | tr '\n' ' ')
              if [ -n "$PRE_EXISTING" ]; then
                supabase migration repair --status applied $PRE_EXISTING
              fi

              echo "=== Passo 3: Aplicando apenas as novas migrations (20260314*) ==="
              supabase db push
            else
              echo "Erro desconhecido — sem IDs para reparar."
              exit 1
            fi
          else
            echo "Migrations aplicadas com sucesso."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Confirm deployment
        run: echo "Deploy concluído no projeto bacqgdjiarwkgkwiqgpa"
