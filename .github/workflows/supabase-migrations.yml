name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply DB Migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref bacqgdjiarwkgkwiqgpa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to production
        run: |
          set +e

          # Tentativa 1: push direto (funciona em runs futuros com histórico em sincronia)
          PUSH_OUTPUT=$(supabase db push 2>&1)
          PUSH_EXIT=$?
          echo "$PUSH_OUTPUT"

          if [ $PUSH_EXIT -eq 0 ]; then
            echo "Migrations aplicadas com sucesso."
            exit 0
          fi

          echo "Push falhou — iniciando sincronização de histórico (setup inicial)..."

          # Passo 1: remover IDs remotos sem arquivo local (caso ainda existam)
          REPAIR_IDS=$(echo "$PUSH_OUTPUT" | grep "migration repair --status reverted" | sed 's/.*reverted //')
          if [ -n "$REPAIR_IDS" ]; then
            echo "Removendo migrations remotas sem arquivo local..."
            supabase migration repair --status reverted $REPAIR_IDS
          fi

          # Passo 2: marcar TODAS as migrations antigas como aplicadas (baseline)
          echo "Marcando migrations pré-existentes como baseline..."
          PRE_EXISTING=$(ls supabase/migrations/*.sql \
            | sed 's|.*/||' | grep -oP '^\d+' | grep -v '^20260314' | sort | tr '\n' ' ')
          if [ -n "$PRE_EXISTING" ]; then
            supabase migration repair --status applied $PRE_EXISTING
          fi

          # Passo 3: push final — aplica somente as migrations novas
          echo "Aplicando novas migrations..."
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Lock Supabase Auth URLs to production domain
        run: |
          curl -sf -X PATCH \
            "https://api.supabase.com/v1/projects/bacqgdjiarwkgkwiqgpa/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "site_url": "https://lasalle360.vercel.app",
              "uri_allow_list": "https://lasalle360.vercel.app,https://lasalle360.vercel.app/**"
            }' \
            && echo "Auth URLs travadas em https://lasalle360.vercel.app" \
            || echo "Aviso: falha ao atualizar Auth URLs (verificar SUPABASE_ACCESS_TOKEN)"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Confirm deployment
        run: echo "Deploy concluído no projeto bacqgdjiarwkgkwiqgpa"
